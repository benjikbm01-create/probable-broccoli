plugins {
    id 'fabric-loom' version '1.11.8'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    // Local retrying mirror (tools/maven-mirror.py) when FI_MIRROR=1, else Maven Central
    if (System.getenv('FI_MIRROR') == '1') { maven { url = 'http://127.0.0.1:8765/central/'; allowInsecureProtocol = true } } else { mavenCentral() }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "forgotten_island" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        server { runDir "run-server"; vmArg "-Xmx4G" }
        client {
            runDir "run-client"
            vmArg "-Xmx3G"
            if (System.getProperty("fi.autopilot")) vmArg "-Dfi.autopilot=" + System.getProperty("fi.autopilot")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

test { useJUnitPlatform(); testLogging { events "passed", "failed", "skipped"; exceptionFormat "full" } }

// Pre-fetches every dependency (useful on flaky networks; run via tools/gradle-retry.sh resolveAll)
tasks.register('resolveAll') {
    doLast {
        configurations.findAll { it.canBeResolved }.each { c ->
            try { c.resolve() } catch (Exception e) { if (!c.name.toLowerCase().contains('archives')) throw e }
        }
    }
}
